name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same-repository runs only. The local runner additionally refuses anything else in its job-started hook
  # (runner configuration, not editable from this file).
  verify:
    name: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, repli-local-ci]
    timeout-minutes: 45
    steps:
      # Fails the job unless the dedicated-user precondition, tools, pinned runner and managed launcher are all in place.
      - name: Local CI readiness
        run: repli-local-ci doctor

      - name: Checkout (without submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false

      # actions/checkout on pull_request checks out GitHub's PR integration (merge) commit == $GITHUB_SHA.
      # Assert that, so the job can never silently verify head-only content.
      - name: Assert exact integration commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out HEAD ${actual} != GITHUB_SHA ${GITHUB_SHA}"
            exit 1
          fi
          echo "verifying ${GITHUB_EVENT_NAME} integration commit ${GITHUB_SHA}"

      # The two private submodules use separate read-only deploy keys. Each key gets its own SSH host
      # alias. Unlike the hosted-VM version, nothing is written to ~/.ssh or the global git config of the
      # runner account: keys, ssh config, known_hosts and git config live in a per-step directory under
      # $RUNNER_TEMP that is removed on every exit path (and again by the runner's job-completed hook).
      - name: Check out private submodules
        env:
          FASTAPI_KEY: ${{ secrets.FASTAPI_SUBMODULE_SSH_KEY }}
          RN_APP_API_KEY: ${{ secrets.RN_APP_API_SUBMODULE_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in FASTAPI_KEY RN_APP_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing Actions secret for $v (FASTAPI_SUBMODULE_SSH_KEY / RN_APP_API_SUBMODULE_SSH_KEY). Secrets are unavailable to PRs from forks."
              exit 1
            fi
          done
          umask 077
          d="$RUNNER_TEMP/submodule-ssh"
          install -d -m 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$FASTAPI_KEY" > "$d/fastapi_deploy_key"
          printf '%s\n' "$RN_APP_API_KEY" > "$d/rn_app_api_deploy_key"
          # Fail-closed host verification: only github.com's Ed25519 key is accepted, and only if it
          # matches GitHub's published fingerprint
          # (https://docs.github.com/authentication/keeping-your-account-and-data-secure/githubs-ssh-key-fingerprints).
          expected_fp="SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
          ssh-keyscan -t ed25519 github.com > "$d/github_host.pub" 2>/dev/null
          actual_fp="$(ssh-keygen -lf "$d/github_host.pub" -E sha256 | awk '{print $2}')"
          if [ "$(wc -l < "$d/github_host.pub" | tr -d ' ')" -ne 1 ] || [ "$actual_fp" != "$expected_fp" ]; then
            echo "::error::github.com Ed25519 host key fingerprint mismatch (got '${actual_fp}', expected ${expected_fp})"
            exit 1
          fi
          install -m 600 "$d/github_host.pub" "$d/known_hosts"
          cat > "$d/ssh_config" <<SSHCFG
          Host github-fastapi
            HostName github.com
            User git
            IdentityFile $d/fastapi_deploy_key
            IdentitiesOnly yes
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile $d/known_hosts
            GlobalKnownHostsFile /dev/null
          Host github-rn-app-api
            HostName github.com
            User git
            IdentityFile $d/rn_app_api_deploy_key
            IdentitiesOnly yes
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile $d/known_hosts
            GlobalKnownHostsFile /dev/null
          SSHCFG
          export GIT_SSH_COMMAND="ssh -F $d/ssh_config"
          export GIT_CONFIG_GLOBAL="$d/gitconfig"
          export GIT_CONFIG_NOSYSTEM=1
          git config --global url."git@github-fastapi:syuan33/repli-fastapi-deployment.git".insteadOf "git@github.com:syuan33/repli-fastapi-deployment.git"
          git config --global url."git@github-rn-app-api:syuan33/repli-rn-app-api.git".insteadOf "git@github.com:syuan33/repli-rn-app-api.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repli-mobile/package-lock.json

      - name: Set up Java (shadow-cljs)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi_deployment/requirements.txt

      # Immutable release asset (tag v2026.01.19 = commit ae39277f7fb8d5af3cd60a770094bde90355a74d), verified by
      # fixed SHA-256 before it is unpacked or executed. The macOS arm64 hash below was computed once by
      # downloading the official asset over TLS; a reviewer MUST cross-check it (the linux hash in the hosted
      # workflow is the maintainers' own).
      - name: Install clj-kondo
        run: |
          set -euo pipefail
          version=2026.01.19
          expected_sha=911f3803be075d59172cb92f0d39aea077fc7550dcdc4e8c946d61552fa51a12
          zip="$RUNNER_TEMP/clj-kondo.zip"
          curl -sSfL -o "$zip" "https://github.com/clj-kondo/clj-kondo/releases/download/v${version}/clj-kondo-${version}-macos-aarch64.zip"
          echo "${expected_sha}  ${zip}" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -qo "$zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/clj-kondo"
          "$RUNNER_TEMP/bin/clj-kondo" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies (locked)
        working-directory: repli-mobile
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r fastapi_deployment/requirements.txt

      # Standard profile: unit scope only. It never touches a backend; the opt-in
      # real-backend groups are recorded as SKIPPED (not verified) in the JSON report.
      - name: Verify (standard profile)
        run: dev/verify.sh -p standard -o "$RUNNER_TEMP/verify-results"

      # Hermetic integration profile (Issue #19): dev/hermetic_backend.py provisions a
      # loopback FastAPI on an OS-assigned port from the checked-out submodule and tears
      # it down on every exit path; the step fails if the backend cannot start (BLOCKED).
      - name: Verify (hermetic integration profile)
        run: dev/verify.sh -p integration -o "$RUNNER_TEMP/verify-results"

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-results
          path: |
            ${{ runner.temp }}/verify-results
          if-no-files-found: ignore
          retention-days: 14

      # Local, non-authoritative report (integration/head/base SHA, result hashes). See README.
      - name: Local CI report
        if: always()
        run: repli-local-ci report --results-dir "$RUNNER_TEMP/verify-results" --job-status "${{ job.status }}"

  # Fork PRs must not run on the Mac. A skipped job would satisfy a required check, so this hosted job
  # carries the same check name `verify` and FAILS for forks (matching the hosted behaviour today, where forks
  # fail for lack of secrets). Needs a disposable-repo test of branch-protection semantics before adoption.
  verify-fork-refusal:
    name: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "::error::Fork pull requests are not verified on the local runner"
          exit 1
