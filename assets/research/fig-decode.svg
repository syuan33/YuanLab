<svg class="fig" viewBox="0 0 690 300" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:690px">
<title id="t">Decode speed falls with context length</title><desc id="d">For the dense Qwen3.7 27B model, decode speed falls from 13.6 tokens per second at 45k prompt tokens to 3.4 at 132k.</desc>
<style>
