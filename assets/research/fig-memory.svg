<svg class="fig" viewBox="0 0 690 184" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:690px">
<title id="t">Resident model memory vs. the guard</title><desc id="d">Ornith oQ4e at 22.65 GB sits right at the oMLX guard watermark of about 23 GB, leaving no KV-cache headroom; Qwen3.8-27B and Ornith oQ3e leave roughly 8 GB.</desc>
<style>
.f-t{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.f-m{fill:var(--muted);font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.f-b{fill:var(--fg);font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.f-box{fill:var(--code-bg);stroke:var(--border);stroke-width:1.2}
.f-acc{fill:var(--accent)}
.f-dim{fill:var(--muted);opacity:.55}
.f-line{stroke:var(--muted);stroke-width:1.2;fill:none}
.f-ln{stroke:var(--accent);stroke-width:2.2;fill:none}
.f-warn{stroke:#c0392b;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.f-warnt{fill:#c0392b;font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.f-grid{stroke:var(--border);stroke-width:1}
</style>
<line class="f-grid" x1="250.0" y1="22" x2="250.0" y2="144"/>
<text class="f-m" x="250.0" y="160" text-anchor="middle">0</text>
<line class="f-grid" x1="324.0" y1="22" x2="324.0" y2="144"/>
<text class="f-m" x="324.0" y="160" text-anchor="middle">6</text>
<line class="f-grid" x1="398.0" y1="22" x2="398.0" y2="144"/>
<text class="f-m" x="398.0" y="160" text-anchor="middle">12</text>
<line class="f-grid" x1="472.0" y1="22" x2="472.0" y2="144"/>
<text class="f-m" x="472.0" y="160" text-anchor="middle">18</text>
<line class="f-grid" x1="546.0" y1="22" x2="546.0" y2="144"/>
<text class="f-m" x="546.0" y="160" text-anchor="middle">24</text>
<line class="f-grid" x1="620.0" y1="22" x2="620.0" y2="144"/>
<text class="f-m" x="620.0" y="160" text-anchor="middle">30</text>
<text class="f-m" x="435.0" y="178" text-anchor="middle">resident memory with model loaded, GB (32 GB machine)</text>
<text class="f-t" x="240" y="47" text-anchor="end">Ornith oQ4e</text>
<rect class="f-dim" x="250" y="34" width="279.4" height="22" rx="3"/>
<text class="f-t" x="537.4" y="50">22.65 GB</text>
<text class="f-t" x="240" y="81" text-anchor="end">Qwen3.8-27B oQ4e</text>
<rect class="f-acc" x="250" y="68" width="226.9" height="22" rx="3"/>
<text class="f-t" x="484.9" y="84">18.4 GB</text>
<text class="f-t" x="240" y="115" text-anchor="end">Ornith oQ3e</text>
<rect class="f-acc" x="250" y="102" width="214.6" height="22" rx="3"/>
<text class="f-t" x="472.6" y="118">17.4 GB</text>
<line class="f-warn" x1="533.7" y1="18" x2="533.7" y2="144"/>
<text class="f-warnt" x="527.7" y="14" text-anchor="end">guard ≈ 23 GB</text>
</svg>
