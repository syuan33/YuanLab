name: local-ci-runner tests

on:
  pull_request:
    paths: ["local-ci-runner/**", ".github/workflows/local-ci-runner-tests.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: local-ci-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # -X dev -W error + StrictCase: a leaked process/file fails the test. Synthetic fixtures only.
      - name: Unit tests (warnings are errors)
        run: PYTHONPATH=src:. python -X dev -W error -m unittest discover -s tests -t . -v
      - name: Smoke test (synthetic)
        run: ./scripts/smoke-local.sh

  # GitHub-hosted macOS arm64: evidence for Apple's /usr/bin/python3 and BSD userland.
  # Synthetic only: never registers a runner, installs a LaunchAgent or touches any real repository.
  test-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: local-ci-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Platform
        run: |
          uname -m
          /usr/bin/python3 --version
      - name: Unit tests with Apple python3 (warnings are errors)
        run: PYTHONPATH=src:. /usr/bin/python3 -X dev -W error -m unittest discover -s tests -t . -v
      - name: Smoke test with Apple python3
        run: PYTHON=/usr/bin/python3 ./scripts/smoke-local.sh
      - name: Dry-runs only (no side effects)
        run: |
          set -x
          export LOCAL_CI_RUNNER_HOME="$RUNNER_TEMP/lcr-home"
          bin/local-ci-runner install --dry-run
          bin/local-ci-runner register --repo example-org/example-repo --dry-run
          bin/local-ci-runner start --dry-run
          bin/local-ci-runner uninstall --dry-run
          test ! -e "$LOCAL_CI_RUNNER_HOME"
      - name: doctor must report NOT READY on an unprovisioned hosted VM
        run: |
          if bin/local-ci-runner doctor; then echo "doctor unexpectedly passed"; exit 1; fi

  pin-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-ci-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: runner-pin.json must match the official release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/local-ci-runner verify-pin
